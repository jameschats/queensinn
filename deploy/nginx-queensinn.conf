# Installed once by deploy.sh (never overwritten, so certbot's TLS edits survive releases).
# TLS:  certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 100m;   # Media:MaxVideoBytes is 80 MB

    # Compress text assets (scripts, styles, JSON, SVG). By default only HTML is compressed, so scripts and styles went out at full size.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    location /api/ {
        proxy_pass http://127.0.0.1:5190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/queensinn/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
