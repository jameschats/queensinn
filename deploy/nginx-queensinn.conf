# Installed once by deploy.sh (never overwritten, so certbot's TLS edits survive releases).
# TLS:  certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 100m;   # Media:MaxVideoBytes is 80 MB

    location /api/ {
        proxy_pass http://127.0.0.1:5190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/queensinn/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
