  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The theme's two fonts are served from this site (see styles.css), so there is no connection to Google's font servers.

  <link rel="preload" href="fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Default icon set. If the admin uploads a favicon, SiteService swaps these (data-qi-icon) for the uploaded one. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" data-qi-icon="svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" data-qi-icon="png">
  <link rel="icon" type="image/x-icon" sizes="48x48" href="favicon.ico" data-qi-icon="ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" data-qi-icon="apple">
  <link rel="manifest" href="site.webmanifest">
  <!-- Per-environment runtime config (API URL, site URL). Written by deploy; see deploy/README.md. -->
  <script src="/config.js" defer></script>
</head>
