<div class="adm grid min-h-svh md:grid-cols-2">
  <aside class="on-dark relative flex min-h-[220px] flex-col justify-end overflow-hidden bg-primary p-8 text-on-primary md:p-14">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_70%_80%,color-mix(in_srgb,var(--color-accent)_35%,transparent),transparent_60%)]"></div>
    <div class="relative"><qi-brand link="/" /></div>
    <p class="relative mt-5 max-w-[36ch] font-light text-on-primary-muted">
      Manage rooms, photographs, colours and enquiries for queensinn.co.in.
    </p>
  </aside>

  <section class="flex items-center justify-center bg-surface p-10">
    <div class="w-full max-w-[380px]">
      <h1 class="!font-serif text-[40px] font-normal">Welcome back</h1>
      <p class="mb-8 mt-1 text-[#6B7485]">Sign in to the {{ site.hotelName() }} admin.</p>

      @if (googleReady()) {
        <div #googleBtn class="min-h-[44px] w-full"></div>
        <div class="my-6 flex items-center gap-3.5 text-xs text-[#8A93A3] before:h-px before:flex-1 before:bg-[#E3E6EB] after:h-px after:flex-1 after:bg-[#E3E6EB]">or with email</div>
      }

      <form class="grid gap-4" (ngSubmit)="submit()" novalidate>
        <label class="alabel">Email
          <input class="ainput" type="email" name="email" autocomplete="username" [(ngModel)]="email" required />
        </label>
        <label class="alabel">Password
          <input class="ainput" type="password" name="password" autocomplete="current-password" [(ngModel)]="password" required />
        </label>
        @if (error()) { <p class="alert" role="alert">{{ error() }}</p> }
        <button class="abtn abtn-pri h-[46px]" type="submit" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
      </form>

      <p class="mt-6 text-[12.5px] text-[#8A93A3]">
        Forgotten your password? Ask a Super Admin to set a temporary one from Staff users.
      </p>
    </div>
  </section>
</div>
